services:
  db:
    image: mysql:8.0
    container_name: joeycare-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: joeycare_db
      MYSQL_USER: joeyuser
      MYSQL_PASSWORD: joeypass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./JoeyCare/backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: joeycare-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DB_HOST: db
      DB_USER: joeyuser
      DB_PASSWORD: joeypass
      DB_NAME: joeycare_db
      DB_PORT: 3306
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: joeycare-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data: